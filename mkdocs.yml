site_name: mgdvault
site_description: Zero-setup secret storage for Python projects.
repo_url: https://github.com/mdinunzio/mgdvault
repo_name: mdinunzio/mgdvault

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Configuration: configuration.md
  - Backends: backends.md
  - Command line: cli.md
  - Claude Code skills: claude-code.md
  - Security notes: security.md
  - API reference: api.md
  - Development: development.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
